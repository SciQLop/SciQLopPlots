<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" role="img" aria-label="Data flow: a pan or zoom calls your function on its thread, the points are reduced on worker threads, and the main thread draws them">
<style>
.bg { fill: #ffffff; stroke: #d0d7de; }
text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
.ts { font-size: 11px; fill: #59636e; }
.tb { font-weight: 600; }
.mono { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 12px; }
.c { text-anchor: middle; }
.r { text-anchor: end; }
.axis { stroke: #8c959f; stroke-width: 1; }
.line { stroke: #59636e; stroke-width: 1.5; fill: none; }
.dash { stroke-dasharray: 4 3; }
.arrow { stroke: #59636e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
.blue { fill: #dbeafe; stroke: #2563eb; }
.orange { fill: #fef3c7; stroke: #d97706; }
.green { fill: #d1fae5; stroke: #059669; }
.red { fill: #fee2e2; stroke: #dc2626; }
.violet { fill: #ede9fe; stroke: #7c3aed; }
.grey { fill: #f6f8fa; stroke: #8c959f; }
.dot-blue { fill: #2563eb; }
.dot-orange { fill: #d97706; }
.dot-grey { fill: #8c959f; }
.nan { fill: #ffffff; stroke: #dc2626; stroke-width: 2; }
.stroke-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
.stroke-orange { stroke: #d97706; stroke-width: 2; fill: none; }
.stroke-green { stroke: #059669; stroke-width: 2; fill: none; }
.stroke-red { stroke: #dc2626; stroke-width: 2; fill: none; }
.text-blue { fill: #2563eb; font-weight: 600; }
.text-orange { fill: #b45309; font-weight: 600; }
.text-green { fill: #047857; font-weight: 600; }
.text-red { fill: #dc2626; font-weight: 600; }
.text-violet { fill: #6d28d9; font-weight: 600; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="759" height="315" rx="8"/>
<rect class="grey" x="20.0" y="46.0" width="720.0" height="74.0" rx="6"/>
<text class="tb" x="34.0" y="88.0">Main thread</text>
<rect class="grey" x="20.0" y="136.0" width="720.0" height="74.0" rx="6"/>
<text class="tb" x="34.0" y="178.0">Callback thread</text>
<rect class="grey" x="20.0" y="226.0" width="720.0" height="74.0" rx="6"/>
<text class="tb" x="34.0" y="268.0">Resampling</text>
<rect class="blue" x="160.0" y="57.0" width="176.0" height="52.0" rx="6"/>
<text class="c tb" x="248.0" y="80.0">1. You pan or zoom</text>
<text class="ts c" x="248.0" y="98.0">the visible range changes</text>
<rect class="green" x="340.0" y="147.0" width="176.0" height="52.0" rx="6"/>
<text class="c tb" x="428.0" y="170.0">2. Your function runs</text>
<text class="ts c" x="428.0" y="188.0">get_data(start, stop)</text>
<rect class="violet" x="520.0" y="237.0" width="176.0" height="52.0" rx="6"/>
<text class="c tb" x="608.0" y="260.0">3. Points reduced</text>
<text class="ts c" x="608.0" y="278.0">min and max per pixel bin</text>
<rect class="blue" x="548.0" y="57.0" width="176.0" height="52.0" rx="6"/>
<text class="c tb" x="636.0" y="80.0">4. Drawn</text>
<text class="ts c" x="636.0" y="98.0">replaces the last image</text>
<path class="arrow" d="M306.0 109.0 L370.0 147.0"/>
<path class="arrow" d="M486.0 199.0 L550.0 237.0"/>
<path class="arrow" d="M648.0 237.0 L676.0 109.0"/>
<text class="ts c" x="380.0" y="26.0">Static data skips step 2. Until step 4, the plot keeps showing the last image.</text>
</svg>