<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
  <title>SciQLopPlots in the browser</title>
  <style>
    html, body { padding: 0; margin: 0; height: 100%; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }
    #status { padding: 4px 8px; font-size: 13px; color: #444; }
    #screen { flex: 1; min-height: 0; }
  </style>
</head>
<body onload="init()">
  <div id="status">Loading SciQLopPlots…</div>
  <div id="screen"></div>
  <script>
    const day = 86400, t0 = Date.UTC(2020, 0, 1) / 1000;

    function lineData(spz, n) {
      const t = new Float64Array(n), v = new Float64Array(n * 3);
      for (let i = 0; i < n; i++) {
        t[i] = t0 + i * day / n;
        const w = 2 * Math.PI * i / n * 20;
        v.set([Math.sin(w), Math.cos(w), Math.sin(3 * w) / 2 + Math.random() * 0.1], i * 3);
      }
      return [spz.Buffer.fromArray(t, [n]), spz.Buffer.fromArray(v, [n, 3])];
    }

    function spectrogramData(spz, n, channels) {
      const t = new Float64Array(n), f = new Float64Array(channels), z = new Float64Array(n * channels);
      for (let j = 0; j < channels; j++) f[j] = 10 * Math.pow(1.1, j);
      for (let i = 0; i < n; i++) {
        t[i] = t0 + i * day / n;
        for (let j = 0; j < channels; j++)
          z[i * channels + j] = Math.exp(-((j - channels / 2 - 10 * Math.sin(i / n * 12)) ** 2) / 40) * 1e3 + 1;
      }
      return [spz.Buffer.fromArray(t, [n]), spz.Buffer.fromArray(f, [channels]),
              spz.Buffer.fromArray(z, [n, channels])];
    }

    async function init() {
      const status = document.querySelector('#status');
      try {
        const spz = await qtLoad({
          qt: { entryFunction: window.sciqlopplots_entry,
                containerElements: [document.querySelector('#screen')] }
        });
        window.spz = spz;   // for the console
        const started = performance.now();
        spz.setTimeRange(t0, t0 + day);   // first: a new plot fits its y axis to the data in view
        spz.line(...lineData(spz, 1_000_000), ['Bx', 'By', 'Bz']);
        spz.colormap(...spectrogramData(spz, 20_000, 64), 'spectrogram', true, true);
        spz.onTimeRangeChanged((start, stop) => {
          status.textContent = `${new Date(start * 1000).toISOString()} → ${new Date(stop * 1000).toISOString()}`;
        });
        status.textContent = `Ready: 1M-point line + 20k×64 spectrogram in ${Math.round(performance.now() - started)} ms`;
      } catch (e) {
        status.textContent = `SciQLopPlots could not start: ${e}`;
        console.error(e);
      }
    }
  </script>
  <script src="sciqlopplots.js"></script>
  <script src="qtloader.js"></script>
</body>
</html>
