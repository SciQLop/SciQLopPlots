<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SciQLopPlots API tests</title>
  <script src="../coi-serviceworker.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .panel { width: 600px; height: 400px; display: inline-block; vertical-align: top; }
  </style>
</head>
<body>
  <pre id="status">running</pre>
  <div id="a" class="panel"></div><div id="b" class="panel"></div><div id="c" class="panel"></div>
  <script type="module">
    import { load, Graph, ColorMap, Span } from '../sciqlopplots.mjs';

    const results = [];
    const check = async (name, fn) => {
      console.info(`step: ${name}`);
      try { await fn(); results.push({ name, ok: true }); }
      catch (e) { results.push({ name, ok: false, error: String(e?.message ?? e) }); }
    };
    const assert = (cond, what) => { if (!cond) throw new Error(what); };
    const near = (a, b) => Math.abs(a - b) < 1e-6 * Math.max(1, Math.abs(b));
    const throws = (fn, what) => { try { fn(); } catch { return; } throw new Error(`${what} did not throw`); };
    const frame = () => new Promise((r) => setTimeout(r, 50));

    const t0 = Date.UTC(2020, 0, 1) / 1000, n = 2000;
    const t = Float64Array.from({ length: n }, (_, i) => t0 + i * 60);
    const sin = t.map((_, i) => Math.sin(i / 50)), cos = t.map((_, i) => Math.cos(i / 50));
    const channels = Float64Array.from({ length: 32 }, (_, j) => 10 * 1.2 ** j);
    const z = Float64Array.from({ length: n * 32 }, (_, k) => 1 + 1e3 * Math.exp(-(((k % 32) - 16) ** 2) / 20));

    let spz, a, b, plot, graph, map, span;
    await check('load', async () => { spz = await load(); });
    await check('version', () => assert(/^\d+\.\d+\.\d+/.test(spz.version), `version ${spz.version}`));
    await check('two panels', () => {
      a = spz.panel(document.querySelector('#a'), { timeRange: [t[0], t[n - 1]] });
      b = spz.panel(document.querySelector('#b'), { theme: 'dark', timeRange: [t[0], t[n - 1]] });
      assert(a.id !== b.id, 'distinct ids');
    });
    await check('time range', () => {
      const [start, stop] = a.timeRange;
      assert(near(start, t[0]) && near(stop, t[n - 1]), `got ${start}, ${stop}`);
    });
    await check('line of 2 columns', () => {
      plot = a.addPlot();
      graph = plot.line(t, [sin, cos], { labels: ['sin', 'cos'], colors: ['red', '#0a0'] });
      assert(graph instanceof Graph, 'a Graph');
    });
    await check('one-column line from a number array', () => b.addPlot().line(Array.from(t), Array.from(sin)));
    await check('scatter', () => plot.scatter(t, cos));
    await check('colormap with log axes', () => {
      map = b.addPlot().colormap(t, channels, z, { name: 'spec', yLog: true, zLog: true, gradient: 'Viridis' });
      assert(map instanceof ColorMap, 'a ColorMap');
    });
    await check('setData', () => { graph.setData(t, [cos, sin]); map.setData(t, channels, z); });
    await check('gap threshold: option, setter, 0 turns it off', () => {
      const p = b.addPlot();
      const line = p.line(t, sin), off = p.line(t, cos, { gapThreshold: 0 }), dots = p.scatter(t, sin, { gapThreshold: 4 });
      assert(line.gapThreshold === 1.5, `default ${line.gapThreshold}`);
      assert(off.gapThreshold === 0 && dots.gapThreshold === 4, `options ${off.gapThreshold}, ${dots.gapThreshold}`);
      line.setGapThreshold(3);
      assert(line.gapThreshold === 3, `after setGapThreshold(3): ${line.gapThreshold}`);
      throws(() => line.setGapThreshold(Number.NaN), 'a NaN threshold');
    });
    await check('axis range', () => {
      plot.setAxis('y', { range: [-2, 3], label: 'B [nT]' });
      const [lo, hi] = plot.axisRange('y');
      assert(near(lo, -2) && near(hi, 3), `got ${lo}, ${hi}`);
    });
    await check('timeRangeChanged', async () => {
      let seen;
      a.on('timeRangeChanged', (start, stop) => { seen = [start, stop]; });
      a.setTimeRange(t[10], t[100]);
      await frame();
      assert(seen && near(seen[0], t[10]) && near(seen[1], t[100]), `got ${seen}`);
    });
    await check('span', async () => {
      span = a.addSpan(t[20], t[40], { color: 'rgba(255, 0, 0, 0.3)', tooltip: 'event' });
      assert(span instanceof Span, 'a Span');
      let seen;
      span.on('rangeChanged', (start, stop) => { seen = [start, stop]; });
      span.setRange(t[30], t[50]);
      await frame();
      const [start, stop] = span.range;
      assert(near(start, t[30]) && near(stop, t[50]), `range ${start}, ${stop}`);
      assert(seen && near(seen[0], t[30]), `event ${seen}`);
    });
    await check('CSS colours (a translucent span is not black)', async () => {
      const panel = spz.panel(document.querySelector('#c'), { timeRange: [t[0], t[n - 1]] });
      panel.addPlot().line(t, t.map(() => 0), { colors: ['hsl(120, 100%, 25%)'] });
      panel.addSpan(t[n / 4], t[3 * n / 4], { color: 'rgba(255, 0, 0, 0.25)' });
      await frame();
      const image = await createImageBitmap(panel.export('png', { width: 400, height: 300 }));
      const canvas = new OffscreenCanvas(image.width, image.height);
      const g = canvas.getContext('2d');
      g.drawImage(image, 0, 0);
      const [r, gr, b] = g.getImageData(image.width / 2, image.height / 4, 1, 1).data;
      throws(() => panel.addSpan(t[0], t[1], { color: 'not a colour' }), 'an invalid colour');
      panel.remove();
      assert(r > 200 && gr > 120 && gr < 240 && b > 120 && b < 240, `span pixel rgb(${r}, ${gr}, ${b})`);
    });
    await check('a panel follows its element when only the element resizes', async () => {
      const element = document.querySelector('#c');
      const panel = spz.panel(element, { timeRange: [t[0], t[n - 1]] });
      panel.addPlot().line(t, sin);
      await frame();
      element.style.width = '800px';
      element.style.height = '500px';
      await new Promise((r) => setTimeout(r, 300));
      const canvas = element.querySelector(':scope > #qt-shadow-container').shadowRoot.querySelector('canvas');
      const { width, height } = canvas.getBoundingClientRect();
      panel.remove();
      element.style.width = element.style.height = '';
      assert(Math.abs(width - 800) < 2 && Math.abs(height - 500) < 2, `canvas ${width}x${height}, element 800x500`);
    });
    await check('projection: trajectory, model curves, pane curve, time marker', async () => {
      const panel = spz.panel(document.querySelector('#c'), { timeRange: [t[0], t[n - 1]] });
      const series = panel.addPlot();
      series.line(t, sin);
      series.on('cursorTimeChanged', () => {});
      const proj = panel.addProjection({ pairs: [[0, 1], [0, 2], [1, 2]], labels: ['X', 'Y', 'Z'] });
      const x = t.map((_, i) => 10 * Math.cos(i / 300)), y = t.map((_, i) => 10 * Math.sin(i / 300)), zz = t.map(() => 1);
      proj.trajectory(t, x, y, zz, { name: 'orbit' });
      proj.referenceCurve([0, 5, 10], [0, 1, 2], [0, 0, 0], { name: 'model', color: 'crimson' });
      const theta = Float64Array.from({ length: 50 }, (_, i) => -Math.PI / 2 + i * Math.PI / 49);
      proj.pane(1).curve(theta.map((a) => 11 * Math.cos(a)), theta.map((a) => 11 * Math.sin(a)), { colors: ['gray'] });
      proj.setTimeMarker(t[n / 2]);
      proj.clearTimeMarker();
      const pane0 = proj.pane(0);
      const fitted = () => { const [lo, hi] = pane0.axisRange('x'); return lo < -9 && hi > 9; };
      for (let i = 0; i < 60 && !fitted(); i++) await frame();   // fits once the curves are resampled
      const [x0, x1] = pane0.axisRange('x');
      throws(() => panel.addProjection({ pairs: [[0, 0], [0, 2], [1, 2]] }), 'pairs of one dimension');
      throws(() => proj.pane(3), 'a fourth pane');
      panel.remove();
      assert(x0 < -9 && x1 > 9, `pane 0 x range [${x0}, ${x1}] does not hold the orbit`);
    });
    await check('export png', async () => {
      const blob = a.export('png');
      const head = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
      assert(blob.type === 'image/png' && blob.size > 1000, `${blob.type} ${blob.size}`);
      assert(head[1] === 0x50 && head[2] === 0x4e && head[3] === 0x47, 'PNG signature');
    });
    await check('errors are exceptions', () => {
      throws(() => plot.colormap(t, channels, z, { gradient: 'NoSuchGradient' }), 'unknown gradient');
      throws(() => spz.m.on(plot.id, 'nope', () => {}), 'unknown event');
      throws(() => spz.m.addPlot(123456), 'unknown id');
      throws(() => plot.colormap(t, channels, z.subarray(1)), 'z not n * m');
      throws(() => spz.m.Buffer.fromArray(new Float64Array(10), [100]), 'a shape larger than the array');
      throws(() => spz.m.Buffer.fromArray(new Float64Array(10), [5, 3]), 'a 2-D shape that does not match');
    });
    await check('a C++ error reaches the page as an Error with its message', () => {
      try { spz.m.addPlot(123456); } catch (e) {
        assert(e instanceof Error && /no such object/.test(e.message), `got ${e}`);
        return;
      }
      throw new Error('did not throw');
    });
    await check('a plot whose colormap C++ rejected can make another', () => {
      // The C++ catch that unregisters the rejected colormap must run in the browser too.
      const p = b.addPlot();
      const buffers = [spz.m.Buffer.fromArray(Float32Array.from(t), [n]),
        spz.m.Buffer.fromArray(channels, [32]), spz.m.Buffer.fromArray(z, [n, 32])];
      try { throws(() => spz.m.colormap(p.id, ...buffers, {}), 'float32 keys'); }
      finally { buffers.forEach((buffer) => buffer.delete()); }
      p.colormap(t, channels, z).setVisible(true);   // throws when the plot made no colormap
    });
    await check('remove', async () => {
      span.remove();
      graph.remove();
      plot.remove();
      await frame();
      throws(() => graph.setData(t, sin), 'a removed graph');
    });
    await check('a new plot can take the place of a removed one', async () => {
      // The removed plot's clean-up was queued with its address; a plot made before it ran
      // could get that address and be deleted with it, under the page.
      const panel = spz.panel(document.querySelector('#c'), { timeRange: [t[0], t[n - 1]] });
      const pause = () => new Promise((r) => setTimeout(r, Math.random() * 20));
      for (let i = 0; i < 40; i++) {
        const p = panel.addPlot();
        const line = p.line(t, [sin, cos]);
        await pause();
        line.remove();
        p.remove();
        await pause();
      }
      panel.remove();
    });
    await check('plots removed while their resampling runs', async () => {
      // Each plot had a thread pool of its own: big data made new threads, which in the browser
      // start only once the main thread is back in the event loop, and removing the plots waited
      // for them on the main thread. The page froze for good.
      const panel = spz.panel(document.querySelector('#c'), { timeRange: [t[0], t[n - 1]] });
      const big = Float64Array.from({ length: 200000 }, (_, i) => t0 + i);
      const wave = big.map((_, i) => Math.sin(i / 500));
      const plots = Array.from({ length: 8 }, () => panel.addPlot());
      plots.forEach((p) => p.line(big, [wave, wave, wave]));
      await new Promise((r) => setTimeout(r, 0));
      plots.forEach((p) => p.remove());
      await frame();
      panel.remove();
    });
    await check('remove a panel', async () => {
      b.remove();
      await frame();
      throws(() => b.addPlot(), 'a removed panel');
      window.lastPanel = spz.panel(document.querySelector('#b'), { timeRange: [t[0], t[n - 1]] });
      window.lastPanel.addPlot().line(t, sin);
    });
    await check('a page can remove every panel and make a new one later', async () => {
      a.remove();
      window.lastPanel.remove();
      await new Promise((r) => setTimeout(r, 300));
      const again = spz.panel(document.querySelector('#a'), { timeRange: [t[0], t[n - 1]] });
      again.addPlot().line(t, sin);
      await frame();
      assert(again.addPlot(), 'no plot on the new panel');
    });

    window.testResult = results;
    const failed = results.filter((r) => !r.ok);
    document.querySelector('#status').textContent = failed.length
      ? `FAILED ${failed.length}/${results.length}\n` + failed.map((r) => `${r.name}: ${r.error}`).join('\n')
      : `PASSED ${results.length}`;
  </script>
</body>
</html>
