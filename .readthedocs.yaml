# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:  # what PySide6 needs to import headless
    - libglib2.0-0t64
    - libegl1
    - libgl1
    - libxkbcommon0
    - libfontconfig1
    - libdbus-1-3
  jobs:
    post_install:
      # The API pages document the installed wheel: the matching release for a tag, else the newest one.
      # A tag's wheels reach PyPI ~30 min after the tag; build_wheels.yml then rebuilds these docs.
      - python -m pip install "sciqlopplots==${READTHEDOCS_GIT_IDENTIFIER#v}" || python -m pip install sciqlopplots

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
