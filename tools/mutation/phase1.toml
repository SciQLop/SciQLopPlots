[[project]]
name = "sciqlopplots"
repo = "."
base = "main"
build_dir = "build-cov"
env = { PATH = "{root}/.venv/bin:/home/jeandet/Qt/6.11.2/gcc_64/bin:{env_PATH}", PKG_CONFIG_PATH = "/home/jeandet/Qt/6.11.2/gcc_64/lib/pkgconfig", LLVM_INSTALL_DIR = "/usr" }
build_cmd = ["{root}/.venv/bin/meson", "compile", "-C", "{build_dir}", "-j", "4", "SciQLopPlotsBindings.abi3.so"]
build_timeout = 540
test_cwd = "/tmp"
test_env = { QT_QPA_PLATFORM = "offscreen", PYTHONPATH = "{build_dir}:{root}" }
batch_tests = true
stop_on_first_kill = true
max_tests = 25
test_cmd = ["{root}/.venv/bin/python", "-m", "pytest", "{tests}", "-q", "-p", "no:cacheprovider", "-rfE", "-x"]
cover_test_cmd = ["{root}/.venv/bin/python", "-m", "coverage", "run", "--data-file={scratch}/.coverage", "--include={build_dir}/SciQLopPlots/__init__.py", "-m", "pytest", "{tests}", "-q", "-p", "no:cacheprovider"]
prune_gcda = true
# The trailing {build_dir} is gcovr's search path, not a duplicate of --object-directory: without it
# gcovr walks the whole repo and trips on NeoQCP's own coverage build under subprojects/.
cover_cmds = [
  ["gcovr", "--root", "{repo}", "--object-directory", "{build_dir}", "--filter", "{repo}/src/", "--json", "{scratch}/gcovr.json", "-j", "4", "{build_dir}"],
  ["sh", "-c", "out=$({root}/.venv/bin/python -m coverage json --data-file={scratch}/.coverage -o {scratch}/coveragepy.json 2>&1) || {{ echo \"$out\" | grep -q 'No data to report' && echo '{{\"files\": {{}}}}' > {scratch}/coveragepy.json || {{ echo \"$out\" >&2; exit 1; }}; }}"],
]
cover_reports = [
  { kind = "gcovr", file = "{scratch}/gcovr.json", root = "{repo}" },
  { kind = "coveragepy", file = "{scratch}/coveragepy.json", root = "{root}" },
]
failure_parser = "pytest"
tests = { glob = ["tests/integration/test_*.py", "tests/unit/test_*.py", "tests/fuzzing/test_*.py"], prefix = "{root}/" }

