[[project.target]]
path = "SciQLopPlots/__init__.py"
functions = ["_as_columns", "_wrapped_callback", "_line_data", "_hide_columns", "_as_values", "_error_bounds", "_band_batch", "_error_batch", "_band", "_error_bars", "_configure_histogram", "_histogram_calling"]
deploy = "{build_dir}/SciQLopPlots/__init__.py"
